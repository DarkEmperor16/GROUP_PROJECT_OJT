version: "3.8"

services:
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: ojt_backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai:8000 # Gọi nội bộ qua tên service 'ai'
    env_file:
      - ./BE/.env
    volumes:
      - backend_uploads:/app/uploads

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: ojt_ai
    restart: always
    # ĐÃ ĐÓNG PORT: Không ánh xạ cổng ra ngoài Internet để tránh bị tool quét.
    # ports:
    #   - "8000:8000"
    environment:
      - BE_SERVICE_URL=http://backend:3000
    volumes:
      - ./BE/.env:/app/BE/.env:ro
      - ./AI/backend/data:/app/AI/backend/data
      # CHIA SẺ KÉT SẮT: Giúp AI đọc được file PDF từ Backend
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: ojt_frontend
    restart: always
    ports:
      - "127.0.0.1:8888:80" # Web UI — chỉ localhost:8888 → container nginx :80
    depends_on:
      - backend
      - ai

  mongodb:
    image: mongo:latest
    container_name: ojt_mongodb
    restart: always
    # ĐÃ ĐÓNG PORT: Khóa kín Database khỏi Internet. Hacker không thể dùng IP để chui vào.
    # ports:
    #   - "27017:27017"
    environment:
      # BẬT XÁC THỰC BẢO MẬT: Bắt buộc Backend phải cung cấp mật khẩu mới được đọc/ghi dữ liệu.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  backend_uploads:
