version: '3.8'

services:
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: ojt_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai:8000
    env_file:
      - ./BE/.env
    volumes:
      - backend_uploads:/app/uploads

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: ojt_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - BE_SERVICE_URL=http://backend:3000
    volumes:
      - ./BE/.env:/app/BE/.env:ro
      - ./AI/backend/data:/app/AI/backend/data
      # CHIA SẺ KÉT SẮT: Giúp AI đọc được file PDF từ Backend
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: ojt_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai

  mongodb:
    image: mongo:latest
    container_name: ojt_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
  backend_uploads: